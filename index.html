<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Room</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="topbar" hidden>
      <strong class="title">🗺️ Meeting Room</strong>
      <span id="sync-status" class="chip">…</span>
      <button id="sync-now" type="button" title="共有フォルダと今すぐ同期">⟳ 同期</button>
      <div id="members" class="members"></div>
      <span class="spacer"></span>
      <button id="help-btn" type="button">？ 操作</button>
      <button id="profile-btn" type="button" class="me"></button>
    </header>
    <canvas id="world"></canvas>
    <section id="help" class="help" hidden>
      <h3>操作</h3>
      <dl>
        <dt>WASD / 矢印</dt><dd>移動（クリックした場所へ歩くことも可）</dd>
        <dt>E / Enter</dt><dd>近くのノードを開く・編集</dd>
        <dt>N</dt><dd>近くのノードに子ノードを追加（近くになければ新しいルート）</dd>
        <dt>G</dt><dd>ノードを持ち上げる / 置く（他のノードの近くに置くとつなぎ直す）</dd>
        <dt>L</dt><dd>ロック / 解除（ロック中は作成者以外が編集・移動・削除できない）</dd>
        <dt>X / Delete</dt><dd>削除</dd>
      </dl>
      <p class="hint">枠と左上の丸は作成者の色、肉球は歩いた跡です。半透明のアバターは、その人が最後にいた場所です。</p>
    </section>
    <div id="banner" class="banner" hidden></div>
    <main id="login" class="login" hidden></main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
